    <section id="kontak" class="py-16 border-t bg-slate-50">
      <div class="max-w-7xl mx-auto px-4 grid lg:grid-cols-2 gap-10 items-start">
        <div>
          <h2 class="text-2xl md:text-3xl font-bold" data-i18n="sec.kontak">Kontak</h2>
          <div class="mt-6 grid sm:grid-cols-2 gap-4">
            <div class="p-4 rounded-xl bg-white ring-1 ring-slate-200">
              <p class="text-sm text-slate-600" data-i18n="kontak.email">Email</p>
              <a href="mailto:ruangbelajarjapan1@gmail.com" class="font-medium">ruangbelajarjapan1@gmail.com</a>
            </div>
            <div class="p-4 rounded-xl bg-white ring-1 ring-slate-200">
              <p class="text-sm text-slate-600" data-i18n="kontak.wa">WhatsApp / Telegram</p>
              <a href="#" class="font-medium" data-i18n="btn.join">Gabung Grup</a>
            </div>
          </div>
        </div>

        <!-- FORM KONTAK: SUDAH TERHUBUNG FORMSPREE -->
        <div class="bg-white p-4 rounded-2xl ring-1 ring-slate-200 shadow-sm">
          <form id="contactForm"
                action="https://formspree.io/f/mldlkpdq"
                method="POST"
                class="grid gap-4">
            <div>
              <label class="text-sm" for="cf-name" data-i18n="form.name">Nama</label>
              <input id="cf-name" name="name" required
                     class="mt-1 w-full rounded-xl border p-3"
                     placeholder="Nama Anda" />
            </div>
            <div>
              <label class="text-sm" for="cf-email" data-i18n="form.email">Email</label>
              <input id="cf-email" type="email" name="email" required
                     class="mt-1 w-full rounded-xl border p-3"
                     placeholder="email@contoh.com" />
            </div>
            <div>
              <label class="text-sm" for="cf-message" data-i18n="form.message">Pesan</label>
              <textarea id="cf-message" name="message" rows="4" required
                        class="mt-1 w-full rounded-xl border p-3"
                        placeholder="Tulis pesan Anda"></textarea>
            </div>

            <!-- metadata (opsional tapi berguna) -->
            <input type="hidden" name="page" value="rbj-site/index.html">
            <!-- honeypot anti-spam -->
            <input type="text" name="_gotcha" style="display:none">

            <button type="submit" id="contactSubmit"
                    class="px-5 py-3 rounded-xl bg-primary-600 text-white"
                    data-i18n="form.send">Kirim</button>

            <p id="contactStatus" class="text-sm text-slate-600"></p>
          </form>
        </div>
      </div>
    </section>

<!-- ... (bagian lain tetap sama) ... -->

  <script>
    // Mobile menu
    const btn = document.getElementById('menuBtn');
    const menu = document.getElementById('mobileMenu');
    btn?.addEventListener('click', () => menu.classList.toggle('hidden'));

    // Tahun dinamis
    document.getElementById('year').textContent = new Date().getFullYear();

    // Back-to-top
    const btt = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 600) btt.classList.remove('hidden'); else btt.classList.add('hidden');
    });
    btt?.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // Highlight nav aktif
    const nav = document.getElementById('mainNav');
    if (nav) {
      const links = nav.querySelectorAll('a[href^="#"]');
      const ids = ['tentang','program','jadwal','artikel','galeri','kontak','daftar'];
      const sections = ids.map(id => document.getElementById(id)).filter(Boolean);
      const onScroll = () => {
        let current = null;
        sections.forEach(sec => {
          const top = sec.getBoundingClientRect().top + window.scrollY - 120;
          if (window.scrollY >= top) current = sec.id;
        });
        links.forEach(a => a.classList.remove('active-link'));
        if (current) {
          links.forEach(a => { if (a.getAttribute('href') === '#' + current) a.classList.add('active-link'); });
        }
      };
      window.addEventListener('scroll', onScroll);
      onScroll();
    }

    // ===== Formspree submit (AJAX) =====
    const f = document.getElementById('contactForm');
    const s = document.getElementById('contactStatus');
    const submitBtn = document.getElementById('contactSubmit');

    f?.addEventListener('submit', async (e) => {
      e.preventDefault();
      s.textContent = 'Mengirim...';
      submitBtn.disabled = true;

      try {
        const formData = new FormData(f);
        const res = await fetch(f.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          s.textContent = 'Terima kasih! Pesan Anda sudah terkirim.';
          f.reset();
        } else {
          s.textContent = 'Gagal mengirim. Coba lagi atau email langsung.';
        }
      } catch (err) {
        s.textContent = 'Koneksi bermasalah. Coba lagi ya.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

  <!-- i18n -->
  <script src="i18n.js"></script>
</body>
</html>
